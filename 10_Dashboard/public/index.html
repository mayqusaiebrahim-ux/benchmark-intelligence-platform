<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Travel Benchmark 2026</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23f59e0b'/%3E%3Cpath d='M50 22 L58 50 L50 78 L42 50 Z' fill='%23111'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/style.css" />
  <!-- Served locally instead of from a CDN so report/markdown views don't
       break on a network that blocks cdn.jsdelivr.net. -->
  <script src="/marked.min.js"></script>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 L16 12 L12 22 L8 12 Z"/></svg>
        </div>
        <div class="brand-text">
          <div class="brand-name">AI Travel Benchmark</div>
          <div class="brand-year">2026</div>
        </div>
      </div>

      <nav id="sidebar-nav" aria-label="Primary">
        <a href="#home" class="nav-item" data-route="home">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg></span>
          Home
        </a>
        <a href="#wizard" class="nav-item" data-route="wizard">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg></span>
          New Benchmark
        </a>
        <a href="#benchmarks" class="nav-item" data-route="benchmarks">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg></span>
          Benchmarks
          <span class="nav-badge" id="badge-count" style="display:none">0</span>
        </a>
        <a href="#queue" class="nav-item" data-route="queue">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2.5 7 5-14 2.5 7h4"/></svg></span>
          Queue
          <span class="nav-badge" id="badge-queue" style="display:none">0</span>
        </a>

        <div class="nav-section-label">Reference</div>
        <a href="#archive" class="nav-item nav-item-secondary" data-route="archive">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8"/><path d="M10 12h4"/></svg></span>
          Archive
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-footer-note">Legacy research &amp; experiments live in <a href="#archive">Archive</a>.</div>
      </div>
    </aside>

    <main id="main">
      <div id="sidebar-backdrop"></div>
      <div id="topbar">
        <button id="sidebar-toggle-btn" aria-label="Open navigation menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div id="page-title">Loading…</div>
        <div id="topbar-center">
          <div id="global-search">
            <input type="text" id="global-search-input" placeholder="Search benchmarks, companies, features…" autocomplete="off" aria-label="Search" />
            <div id="global-search-results"></div>
          </div>
        </div>
        <button id="mobile-search-toggle-btn" aria-label="Search" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </button>
        <div id="topbar-actions"></div>
      </div>
      <div id="content">
        <div class="loading-state">
          <div class="spinner"></div>
          <div>Loading dashboard…</div>
        </div>
      </div>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
