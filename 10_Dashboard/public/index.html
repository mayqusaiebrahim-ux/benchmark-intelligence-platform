<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Travel Benchmark 2026</title>
  <!-- Sprint 27 (P1-7): inline SVG favicon, matches the sidebar's ✈ brand icon — no external asset. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23f59e0b'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='%23111'%3E%E2%9C%88%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/style.css" />
  <!-- Sprint 27 (P1-6): served locally instead of from a CDN — a report/markdown
       view no longer silently breaks on a network that blocks cdn.jsdelivr.net
       (a real risk for an internal, corporate-network audience). -->
  <script src="/marked.min.js"></script>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">✈</div>
        <div class="brand-text">
          <div class="brand-name">AI Travel Benchmark</div>
          <div class="brand-year">2026</div>
        </div>
      </div>

      <nav id="sidebar-nav">
        <div class="nav-section-label workspace-only">Workspace</div>
        <a href="#wizard" class="nav-item workspace-only" data-route="wizard" title="Full, in-depth benchmark for any company — the 11-deliverable research pass. Takes several minutes.">
          <span class="nav-icon">+</span> New Benchmark
        </a>
        <a href="#queue" class="nav-item workspace-only" data-route="queue">
          <span class="nav-icon">▤</span> Queue
          <span class="nav-badge" id="badge-queue" style="display:none">0</span>
        </a>

        <div class="nav-section-label">Overview</div>
        <a href="#home" class="nav-item" data-route="home">
          <span class="nav-icon">⬡</span> Home
        </a>
        <a href="#benchmarks" class="nav-item" data-route="benchmarks">
          <span class="nav-icon">◈</span> Benchmark Library
          <span class="nav-badge" id="badge-count">0</span>
        </a>
        <a href="#homepage-benchmarks" class="nav-item" data-route="homepage-benchmarks" title="Quick automated homepage-only scan, airlines only — done in under a minute, no setup.">
          <span class="nav-icon">⌂</span> Homepage Benchmark
        </a>

        <div class="nav-section-label" id="section-completed" style="display:none">Completed</div>
        <div id="nav-companies"></div>

        <div class="nav-section-label">Analysis</div>
        <a href="#comparison" class="nav-item" data-route="comparison" title="Side-by-side view for 2–4 companies you pick.">
          <span class="nav-icon">⇄</span> Comparison
        </a>
        <a href="#matrix" class="nav-item" data-route="matrix" title="Every benchmarked company and every score dimension, in one table.">
          <span class="nav-icon">⊞</span> Score Matrix
        </a>
        <a href="#trends" class="nav-item" data-route="trends">
          <span class="nav-icon">↗</span> Trends
        </a>
        <a href="#saudia" class="nav-item" data-route="saudia">
          <span class="nav-icon">◎</span> Saudia Opportunities
        </a>
      </nav>

      <div class="sidebar-footer">
        <!-- Sprint 27 (P0-5): this used to be an unexplained switch that
             silently hides New Benchmark/Queue when turned on — the
             subtitle below is the fix, no behavior change. -->
        <div class="presentation-toggle" id="presentation-toggle" role="button" tabindex="0" aria-pressed="false" title="Hides New Benchmark and Queue — for showing this dashboard to stakeholders without exposing in-progress work.">
          <span>
            Presentation Mode
            <div class="presentation-toggle-sub">Hides New Benchmark &amp; Queue for demos</div>
          </span>
          <span class="pt-switch"></span>
        </div>
        <div class="progress-label">
          <span id="progress-text">0 / 0 complete</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill" style="width:0%"></div>
        </div>
      </div>
    </aside>

    <main id="main">
      <div id="sidebar-backdrop"></div>
      <div id="topbar">
        <button id="sidebar-toggle-btn" aria-label="Open navigation menu" aria-expanded="false">☰</button>
        <div id="page-title">Loading…</div>
        <div id="topbar-center">
          <div id="global-search">
            <input type="text" id="global-search-input" placeholder="Search companies, patterns, capabilities…" autocomplete="off" />
            <div id="global-search-results"></div>
          </div>
        </div>
        <!-- Sprint 27 (P1-2): below 900px #topbar-center (and search with it)
             is hidden entirely with no other way to reach it — this button
             is the replacement, shown only at that width via CSS. -->
        <button id="mobile-search-toggle-btn" aria-label="Search" aria-expanded="false">⌕</button>
        <div id="topbar-actions"></div>
      </div>
      <div id="content">
        <div class="loading-state">
          <div class="spinner"></div>
          <div>Loading dashboard…</div>
        </div>
      </div>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
