# Render Blueprint for the Benchmark Intelligence Platform.
# Deploy root must be this folder (AI_Travel_Benchmark_2026/) — see DEPLOYMENT.md
# for why (10_Dashboard/server.js reads sibling project folders one level up).
#
# NOTE: server.js currently hardcodes `const PORT = 3000` instead of reading
# process.env.PORT. Render assigns its own PORT and requires the service to
# bind to it — this will not work until that one line is changed. See
# DEPLOYMENT.md, "Required code change before first deploy."
services:
  - type: web
    name: benchmark-intelligence-platform
    runtime: node
    plan: starter
    # PLAYWRIGHT_BROWSERS_PATH=0 is set inline on both commands, not via the
    # envVars list below. Confirmed directly: the browser install command
    # and PLAYWRIGHT_BROWSERS_PATH's effect on it both work correctly when
    # the var is actually present in that process's environment. What is
    # NOT independently verifiable from this repo is whether Render's
    # separate envVars list actually reaches an already-deployed service's
    # runtime process without a manual Blueprint re-sync — the most likely
    # explanation for the var appearing to have no effect, but not something
    # this repo can confirm on Render's side. Inlining the var on both
    # commands removes the dependency on that mechanism entirely: build and
    # start now carry it directly, in the exact command strings Render has
    # been observed to execute verbatim.
    buildCommand: PLAYWRIGHT_BROWSERS_PATH=0 npm install
    startCommand: PLAYWRIGHT_BROWSERS_PATH=0 npm start
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: NODE_VERSION
        value: 20
      # ─── Authentication (Clerk) — required for the team beta ────────────
      # Without both keys every /api route returns 401 and the app shows
      # only the sign-in screen. The publishable key is safe in the browser;
      # the secret key is server-only and never logged. See 10_Dashboard/lib/auth.js.
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      # Moves Feature Benchmark's Chromium (Discovery, Navigation Runner) off
      # Render entirely — Render Free/Starter's RAM ceiling could not survive
      # a local headless Chromium even after the memory-optimization pass.
      # See 11_Benchmark_Engine/modules/browserLauncher.js.
      - key: BROWSER_PROVIDER
        value: browserbase
      - key: BROWSERBASE_API_KEY
        sync: false
      # Only required if your Browserbase account needs a project id on
      # session creation — see browserLauncher.js. Leave unset if not needed.
      - key: BROWSERBASE_PROJECT_ID
        sync: false
      # ─── Persistent object storage (Cloudflare R2) ──────────────────────
      # Render's filesystem is ephemeral on the free tier and rebuilt on
      # deploy — Benchmark_Requests.json, generated Feature Benchmark reports
      # and screenshot evidence do not survive a restart. With
      # STORAGE_PROVIDER=r2 the app mirrors those generated runtime artifacts
      # to a private R2 bucket and restores them on boot. See
      # 10_Dashboard/lib/storage/ and 13_Orchestrator/PERSISTENCE_AUDIT.md.
      # Leave STORAGE_PROVIDER unset (or =local) to keep the old
      # local-filesystem-only behaviour.
      - key: STORAGE_PROVIDER
        value: r2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
    # A persistent Disk is still declared, but is no longer load-bearing:
    # with R2 configured the generated state is safe regardless of whether
    # this instance type actually provisions the Disk. On a plan without
    # Disk support the mount is simply ignored and R2 covers persistence.
    disk:
      name: benchmark-data
      mountPath: /opt/render/project/src
      sizeGB: 2
