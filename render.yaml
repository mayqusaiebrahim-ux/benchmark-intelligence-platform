# Render Blueprint for the Benchmark Intelligence Platform.
# Deploy root must be this folder (AI_Travel_Benchmark_2026/) — see DEPLOYMENT.md
# for why (10_Dashboard/server.js reads sibling project folders one level up).
#
# NOTE: server.js currently hardcodes `const PORT = 3000` instead of reading
# process.env.PORT. Render assigns its own PORT and requires the service to
# bind to it — this will not work until that one line is changed. See
# DEPLOYMENT.md, "Required code change before first deploy."
services:
  - type: web
    name: benchmark-intelligence-platform
    runtime: node
    plan: starter
    # PLAYWRIGHT_BROWSERS_PATH=0 is set inline on both commands, not via the
    # envVars list below. Confirmed directly: the browser install command
    # and PLAYWRIGHT_BROWSERS_PATH's effect on it both work correctly when
    # the var is actually present in that process's environment. What is
    # NOT independently verifiable from this repo is whether Render's
    # separate envVars list actually reaches an already-deployed service's
    # runtime process without a manual Blueprint re-sync — the most likely
    # explanation for the var appearing to have no effect, but not something
    # this repo can confirm on Render's side. Inlining the var on both
    # commands removes the dependency on that mechanism entirely: build and
    # start now carry it directly, in the exact command strings Render has
    # been observed to execute verbatim.
    buildCommand: PLAYWRIGHT_BROWSERS_PATH=0 npm install
    startCommand: PLAYWRIGHT_BROWSERS_PATH=0 npm start
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: NODE_VERSION
        value: 20
    disk:
      name: benchmark-data
      mountPath: /opt/render/project/src
      sizeGB: 2
